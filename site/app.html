<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>整理文章｜拾頁 StudyNote</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body><header class="nav wrap"><a class="brand" href="index.html"><span class="brand-icon">拾</span>拾頁 <small>StudyNote</small></a><a class="text-link" href="index.html">返回作品介紹 ↗</a></header><main class="wrap app-main"><div class="app-title"><p class="eyebrow"><span class="dot"></span> LOCAL WORKSPACE</p><h1>下一篇，留下什麼？</h1><p class="muted">貼上文章，由本機 Ollama 整理摘要、重點與測驗。每次 30–6,000 字。</p></div><div class="app-grid"><form id="note-form" class="app-card"><label for="article">你的文章</label><textarea id="article" placeholder="在這裡貼上課堂筆記或文章…" minlength="30" maxlength="6000" required></textarea><div class="app-actions"><button class="secondary" type="button" id="load-example">填入示範文章</button><span id="counter" class="counter">0 / 6,000 字</span></div><div class="app-actions"><button type="submit" id="generate" class="button">整理成筆記 <span>↗</span></button></div><p id="status" role="status" aria-live="polite">正在確認本機服務…</p><p class="muted">內容僅送往本機 Ollama；不會自動儲存或上傳。整理後可自行下載。</p></form><section class="app-card" aria-label="產生的筆記" aria-live="polite"><div id="empty" class="empty-state"><strong>為知識，留一個位置。</strong><p>產生的筆記會顯示在這裡。<br>請先閱讀，再用測驗練習回想。</p></div><div id="result" hidden><p class="eyebrow">YOUR STUDY NOTE</p><h2 id="result-title"></h2><p id="result-summary" class="summary-text"></p><ol id="result-points" class="key-points"></ol><h3>自我測驗</h3><div id="result-quiz"></div><p id="result-meta" class="muted"></p><div class="download-actions"><button id="download-json" type="button">下載 JSON ↓</button><button id="download-md" type="button">下載 Markdown ↓</button></div><p class="muted">AI 內容仍可能有錯誤，請對照原文核對。</p></div></section></div></main></body></html>
